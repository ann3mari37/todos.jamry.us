# Momentum — one Cloudflare Worker serves the web app (static assets) and the API (/api/*).
name = "momentum-api"
# Cloudflare account ann3mari37@gmail.com (moved here from the annemarie@ohrrenova.com account on 2026-10-25).
account_id = "1ee0ccf466cef622b87273a6b7d79056"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The whole site, on every address it runs at: app files from ../app/dist, API calls handled by src/index.ts.
# The dashboard is a custom domain, so Cloudflare creates its DNS record and certificate itself.
routes = [
  { pattern = "todos.jamry.us/*", zone_name = "jamry.us" },
  { pattern = "dashboard.malindaperryconsulting.com", custom_domain = true },
]

# Deployed automatically by Cloudflare Workers Builds on every push to main (see docs/OPERATIONS.md):
#   root directory: worker   build command: npm ci && npm run build:app   deploy command: npx wrangler deploy
[assets]
directory = "../app/dist"
binding = "ASSETS"
# Deep links (/project/123, /inbox…) load the app, which routes them in the browser.
not_found_handling = "single-page-application"
# API requests and the AI-chat connector's sign-in discovery always reach the Worker code, never the app files.
run_worker_first = ["/api/*", "/.well-known/oauth-*"]

[triggers]
crons = ["17 13 * * *"] # daily, 13:17 UTC

[vars]
ENVIRONMENT = "production"
AI_MODEL = "claude-opus-5-5"
OPENAI_TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe" # optional voice input; needs OPENAI_API_KEY
# Every address the app is served from (links and CORS follow the one a request came in on).
ALLOWED_ORIGINS = "https://todos.jamry.us,https://dashboard.malindaperryconsulting.com"
AI_HOURLY_LIMIT = "60"
AI_DAILY_COST_CAP_USD = "1.00"
APP_URL = "https://todos.jamry.us"
SUPABASE_URL = "https://noyenmjdzfglniennbdo.supabase.co"
# SUPABASE_ANON_KEY is stored as a secret (wrangler secret put SUPABASE_ANON_KEY).
# Email OAuth client IDs are public; set GOOGLE_CLIENT_ID / MS_CLIENT_ID here or in the dashboard.
# Secrets (never commit):  wrangler secret put SUPABASE_SERVICE_ROLE_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY (voice, optional) /
#   EMAIL_TOKEN_KEY / GOOGLE_CLIENT_SECRET / MS_CLIENT_SECRET

[observability]
enabled = true

[env.dev]
name = "momentum-api-dev"
routes = []
workers_dev = true
[env.dev.triggers]
crons = []
[env.dev.vars]
ENVIRONMENT = "dev"
AI_MODEL = "claude-opus-5-5"
OPENAI_TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"
ALLOWED_ORIGINS = "http://localhost:8081"
AI_HOURLY_LIMIT = "60"
AI_DAILY_COST_CAP_USD = "0.50"
APP_URL = "http://localhost:8081"
API_URL = "http://localhost:8787"

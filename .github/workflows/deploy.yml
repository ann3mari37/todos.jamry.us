name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: worker
      - run: npx tsc --noEmit && npx vitest run
        working-directory: app
      - run: npx tsc --noEmit && npx vitest run
        working-directory: worker

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
      - name: Apply database migrations
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
      - name: Deploy API worker
        working-directory: worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_TOKEN_KEY: ${{ secrets.EMAIL_TOKEN_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          npm ci
          EXTRA_VARS=()
          [ -n "${{ vars.GOOGLE_CLIENT_ID }}" ] && EXTRA_VARS+=(--var "GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}")
          [ -n "${{ vars.MS_CLIENT_ID }}" ] && EXTRA_VARS+=(--var "MS_CLIENT_ID:${{ vars.MS_CLIENT_ID }}")
          npx wrangler deploy \
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }} \
            --var SUPABASE_ANON_KEY:${{ vars.SUPABASE_ANON_KEY }} \
            "${EXTRA_VARS[@]}"
          # Worker secrets come from GitHub secrets, so every credential lives in one place.
          echo "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          # Email is optional: only push the secrets that are configured.
          for name in EMAIL_TOKEN_KEY GOOGLE_CLIENT_SECRET MS_CLIENT_SECRET; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx wrangler secret put "$name"; fi
          done
      - name: Build & deploy web app to Cloudflare Pages
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build:web
          npx wrangler pages project create momentum --production-branch main 2>/dev/null || true
          npx wrangler pages deploy dist --project-name momentum --branch main

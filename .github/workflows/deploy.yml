name: Tests

# Deploys are done by Cloudflare Workers Builds (see docs/OPERATIONS.md), so GitHub needs no secrets.
# This workflow only checks that the code builds and the tests pass.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: worker
      - run: npx tsc --noEmit && npx vitest run
        working-directory: app
      - run: npx tsc --noEmit && npx vitest run
        working-directory: worker
